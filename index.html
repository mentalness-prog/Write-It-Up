<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Handwriting Quest / مغامرة الخط / L'Aventure de l'Écriture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@500;700&family=Playwrite+US+Modern&family=Playwrite+FR+Trad&display=swap" rel="stylesheet">
<link rel="icon" id="favicon" href="">
<style>
  :root{
    --paper:#FFF9F0;
    --paper-deep:#FFE9CC;
    --ink:#2E2150;
    --teal:#00D9B8;
    --teal-deep:#00A88F;
    --coral:#FF5C8A;
    --coral-deep:#E13F6C;
    --gold:#FFB627;
    --moss:#1FD980;
    --line:#FFC2E0;
    --white:#FFFFFF;
    --sky:#2EC4F1;
    --grape:#8B5CF6;
    --sun:#FFD93D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(circle at 6% 10%, rgba(46,196,241,0.55), transparent 30%),
      radial-gradient(circle at 94% 8%, rgba(255,217,61,0.55), transparent 30%),
      radial-gradient(circle at 8% 90%, rgba(31,217,128,0.45), transparent 32%),
      radial-gradient(circle at 92% 92%, rgba(255,92,138,0.45), transparent 32%),
      radial-gradient(circle at 50% 45%, rgba(139,92,246,0.18), transparent 45%),
      linear-gradient(180deg, #FFFBF2, #FFF3FA);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Nunito',sans-serif;
    min-height:100%;
    overflow-x:hidden;
  }
  body[dir="rtl"] .stage{ text-align:right; }
  h1,h2,h3,.display{ font-family:'Baloo 2','Nunito',sans-serif; }
  [lang="ar"], .arabic-text{ font-family:'Noto Naskh Arabic','Baloo 2',sans-serif; }

  .app{ max-width:920px; margin:0 auto; padding:18px 16px 60px; }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    flex-wrap:wrap; margin-bottom:14px;
    position:sticky; top:8px; z-index:50;
    background:rgba(255,255,255,0.9); backdrop-filter:blur(6px);
    border-radius:16px; padding:8px 10px; border:2px solid var(--ink);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:44px;height:44px;border-radius:50%; background:linear-gradient(135deg, var(--sky), var(--grape)); color:var(--white);
    display:flex;align-items:center;justify-content:center;font-size:22px; flex-shrink:0; overflow:hidden;
    box-shadow:0 3px 0 var(--teal-deep);
  }
  .brand-mark img{ width:100%; height:100%; object-fit:cover; display:block; }
  .welcome-logo{
    width:104px; height:104px; border-radius:50%; margin:0 auto 14px; display:block;
    box-shadow:0 5px 0 var(--teal-deep); border:3px solid var(--white); outline:2px solid var(--teal);
  }
  .brand-title{ font-weight:700; font-size:1.15rem; line-height:1.1; }
  .brand-sub{ font-size:.78rem; opacity:.65; font-weight:600; }

  .top-controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .lang-switch{ display:flex; border:2px solid var(--ink); border-radius:999px; overflow:hidden; }
  .lang-switch button{
    border:none; background:var(--white); color:var(--ink); padding:7px 13px; font-weight:700;
    cursor:pointer; font-size:.82rem; font-family:'Nunito',sans-serif;
  }
  .lang-switch button.active{ background:linear-gradient(135deg, var(--grape), var(--sky)); color:var(--white); }
  .stars-pill{
    display:flex; align-items:center; gap:5px; background:linear-gradient(135deg,#FFF3D6,#FFE29B); border:2px solid var(--gold);
    border-radius:999px; padding:6px 13px; font-weight:800; font-size:.88rem;
  }
  .icon-btn{
    background:var(--white); border:2px solid var(--ink); border-radius:999px; width:38px;height:38px;
    display:flex;align-items:center;justify-content:center; cursor:pointer; font-size:1rem;
    padding:0; font-family:inherit;
  }

  /* ---------- Stage card ---------- */
  .stage{
    background:var(--white); border:2px solid var(--ink); border-radius:22px; padding:26px 22px 22px;
    box-shadow:0 6px 0 rgba(46,33,80,0.15);
    position:relative; overflow:hidden;
  }
  .stage::before{
    content:""; position:absolute; top:0; left:0; right:0; height:8px;
    background:linear-gradient(90deg, var(--sky), var(--sun), var(--moss), var(--coral), var(--grape));
  }
  .eyebrow-free{ font-size:.8rem; font-weight:700; color:var(--teal-deep); margin:0 0 4px; }
  .stage h2{ margin:0 0 6px; font-size:1.5rem; }
  .stage p.lead{ margin:0 0 16px; opacity:.75; font-size:.95rem; line-height:1.5;}

  /* ---------- Onboarding ---------- */
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-weight:700; margin-bottom:6px; font-size:.9rem; }
  .field input[type=text]{
    width:100%; padding:11px 14px; border-radius:12px; border:2px solid var(--line);
    font-size:1rem; font-family:inherit; background:var(--paper);
  }
  .field input[type=text]:focus{ outline:3px solid var(--gold); border-color:var(--teal); }
  .pickrow{ display:flex; gap:10px; flex-wrap:wrap; }
  .pickcard{
    flex:1; min-width:120px; border:2px solid var(--line); border-radius:14px; padding:12px;
    cursor:pointer; background:var(--paper); text-align:center; transition:transform .1s;
  }
  .pickcard:hover{ transform:translateY(-2px); }
  .pickcard.selected{ border-color:var(--teal); background:#DFFAF3; box-shadow:0 3px 0 var(--teal);}
  .pickcard .em{ font-size:1.6rem; display:block; margin-bottom:4px; }
  .avatar-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .avatar-choice{
    width:52px;height:52px;border-radius:50%; border:2px solid var(--line); background:var(--paper);
    font-size:1.4rem; display:flex;align-items:center;justify-content:center; cursor:pointer;
  }
  .avatar-choice.selected{ border-color:var(--coral); background:#FFDCE8; box-shadow:0 0 0 3px rgba(255,92,138,.3); }

  .btn{
    border:none; border-radius:14px; padding:12px 20px; font-weight:800; font-size:.95rem;
    cursor:pointer; font-family:'Nunito',sans-serif;
  }
  .btn-primary{ background:linear-gradient(135deg, var(--coral), #FF9152); color:var(--white); box-shadow:0 4px 0 var(--coral-deep); }
  .btn-primary:active{ transform:translateY(3px); box-shadow:none; }
  .btn-secondary{ background:var(--paper); color:var(--ink); border:2px solid var(--sky); box-shadow:0 3px 0 #1B9FCC; }
  .btn-ghost{ background:transparent; color:var(--teal-deep); border:2px solid var(--teal-deep); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }

  /* ---------- Map / hub ---------- */
  .map-wrap{ position:relative; padding:10px 4px 4px; }
  .path-svg{ width:100%; height:auto; display:block; }
  .islands{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-top:6px; }
  .island{
    border:2px solid var(--line); border-radius:16px; padding:14px; background:var(--paper);
    display:flex; flex-direction:column; gap:6px; position:relative;
  }
  .island.locked{ opacity:.55; }
  .island .isle-icon{ font-size:1.8rem; }
  .island h3{ margin:2px 0 0; font-size:1.05rem; }
  .island .isle-desc{ font-size:.78rem; opacity:.7; min-height:32px; }
  .progress-bar{ height:9px; background:var(--line); border-radius:999px; overflow:hidden; }
  .progress-bar > div{ height:100%; background:var(--moss); }
  .lock-badge{ position:absolute; top:10px; inset-inline-end:12px; font-size:1rem; }

  .badge-shelf{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .badge-chip{
    background:#fff3da; border:2px solid var(--gold); border-radius:999px; padding:5px 12px;
    font-size:.78rem; font-weight:700; display:flex; align-items:center; gap:5px;
  }

  /* ---------- Level list ---------- */
  .level-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; margin:14px 0; }
  .level-btn{
    border:2px solid var(--sky); background:#EAF8FF; border-radius:12px; padding:10px 6px;
    font-family:inherit; font-weight:800; cursor:pointer; font-size:1rem; text-align:center;
  }
  .level-btn .lvl-stars{ display:block; font-size:.7rem; margin-top:3px; color:#C98A00; font-weight:700;}
  .level-btn.done{ border-color:var(--moss); background:#DEFCEE; }
  .level-btn.active{ border-color:var(--coral); box-shadow:0 0 0 3px rgba(255,92,138,.25); }

  .custom-box{ display:flex; gap:8px; margin:10px 0 4px; flex-wrap:wrap; }
  .custom-box input{ flex:1; min-width:160px; padding:10px 12px; border-radius:10px; border:2px solid var(--line); font-size:1.05rem; }

  /* ---------- Canvas trace area ---------- */
  .canvas-wrap{
    position:relative; border:2px dashed var(--line); border-radius:16px; background:repeating-linear-gradient(
      to bottom, transparent 0 39px, rgba(42,33,24,.08) 39px 41px
    ), var(--white);
    touch-action:none; overflow:hidden; margin-top:8px;
  }
  canvas{ display:block; width:100%; touch-action:none; }
  .canvas-layer{ position:absolute; inset:0; }

  .tools{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:12px; }
  .tool{ display:flex; flex-direction:column; gap:4px; font-size:.78rem; font-weight:700; min-width:130px; }
  .tool input[type=range]{ width:100%; }

  .feedback-banner{
    margin-top:14px; padding:14px 16px; border-radius:14px; font-weight:700; font-size:.95rem;
    display:none; align-items:center; gap:10px;
  }
  .feedback-banner.show{ display:flex; }
  .fb-great{ background:#e6f2e3; border:2px solid var(--moss); color:#2d4025; }
  .fb-ok{ background:#fdf3dc; border:2px solid var(--gold); color:#5c4816; }
  .fb-retry{ background:#fdece7; border:2px solid var(--coral); color:#7a3524; }
  .stars-earned{ font-size:1.2rem; letter-spacing:2px; }

  .warmup-legend{ font-size:.82rem; opacity:.7; margin-top:6px; }

  footer.note{ text-align:center; font-size:.72rem; opacity:.55; margin-top:26px; line-height:1.5; }

  @media (max-width:520px){
    .stage{ padding:16px; border-radius:16px; }
    .brand-title{ font-size:1rem; }
  }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  button:focus-visible, .island:focus-visible, .pickcard:focus-visible, .avatar-choice:focus-visible, [role="button"]:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:3px solid var(--grape); outline-offset:2px;
  }

  /* ---------- Print Studio ---------- */
  .print-controls .lang-switch{ margin:6px 0 14px; }
  .check-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:8px; margin:10px 0; }
  .check-item{ display:flex; align-items:center; gap:6px; border:2px solid var(--line); border-radius:10px; padding:8px 10px; font-weight:700; font-size:.85rem; cursor:pointer; background:var(--paper); }
  .check-item input{ width:16px;height:16px; }
  textarea#printCustom{ width:100%; min-height:70px; padding:10px 12px; border-radius:10px; border:2px solid var(--line); font-family:inherit; font-size:.95rem; }
  #printWrapper{ display:none; }
  .worksheet-page{ padding:14px 4px; }
  .worksheet-page h2{ font-family:'Baloo 2',sans-serif; margin:0 0 4px; }
  .worksheet-page .ws-sub{ font-size:.85rem; opacity:.65; margin:0 0 18px; }
  .ws-row{ margin-bottom:26px; }
  .ws-row .ws-line{
    border-bottom:1.5px solid #333; position:relative; padding:14px 4px 16px;
    font-size:2rem; line-height:1.5; white-space:normal; overflow:visible;
    display:flex; flex-wrap:wrap; gap:22px; align-items:baseline;
  }
  .ws-row .ws-line::after{ content:""; position:absolute; left:0; right:0; top:44%; border-top:1px dashed #bbb; }
  .ws-model{ color:#111; font-weight:800; position:relative; z-index:1; }
  .ws-ghost{ color:#bbb; font-weight:700; position:relative; z-index:1; }
  .ws-blank-line{ border-bottom:1.5px solid #333; height:52px; position:relative; margin-bottom:22px; }
  .ws-blank-line::after{ content:""; position:absolute; left:0; right:0; top:50%; border-top:1px dashed #bbb; }
  @media print{
    body > *:not(#printWrapper){ display:none !important; }
    body{ background:#fff !important; }
    #printWrapper{ display:block !important; }
    @page{ margin:16mm; }
  }
</style>
</head>

const AVATARS = ["🦊","🐼","🦁","🐧","🐢","🦄","🐝","🐬"];

/* ---------------- State ---------------- */
function freshState(){
  return {
    name:"", avatar:"🦊", lang:"en", tier:"A", leftHanded:false,
    stars:0, badges:[],
    completed:{ warmup:{}, letters:{}, words:{}, sentences:{}, memory:{}, numbers:{} },
    streak:0, lastPlayDate:null,
    guideOpacity:0.35, penWidth:14,
    onboarded:false
  };
}
let state = freshState();
let view = "loading"; // loading | profile-picker | onboard | map | levels | trace | warmup | ...
let currentChapter = null; // letters|words|sentences
let currentTarget = null;  // string being traced
let currentLevelIndex = 0;
let currentPatternKey = null;
let currentProfileId = null;
let profilesList = []; // [{id, name, avatar}] — lets several children share one device

// ---- Group Mode: turn-based practice for 2-4 learners on one device ----
let groupMembers = [];      // [{id,name,avatar}] selected participants
let groupTurnIndex = 0;
let groupChapterType = null; // 'letters'|'numbers'|'words'|'sentences'|'warmup'
let groupTarget = null;      // word/letter or pattern key for this round
let groupResults = [];       // [{id,name,avatar,stars}]
let groupHostProfileId = null; // whoever's profile was active before Group Mode started
let groupPhase = 'pass';     // 'pass' (hand-off screen) | 'trace' (active turn)

const CHAPTER_ORDER = ["warmup","letters","words","sentences"];
const UNLOCK_THRESHOLD = { letters:0, words:15, sentences:35 }; // stars needed

/* ---------------- Persistence (per-learner profiles) ---------------- */
async function loadProfilesIndex(){
  try{
    const res = await window.storage.get('profiles_index', false);
    if(res && res.value) profilesList = JSON.parse(res.value) || [];
  }catch(e){ profilesList = []; }
}
async function saveProfilesIndex(){
  try{ await window.storage.set('profiles_index', JSON.stringify(profilesList), false); }catch(e){ /* best-effort */ }
}
async function loadProfileState(id){
  state = freshState();
  try{
    const res = await window.storage.get('profile:'+id, false);
    if(res && res.value){ state = Object.assign(state, JSON.parse(res.value)); }
  }catch(e){ /* new/empty profile */ }
  state.completed = state.completed || {};
  ['warmup','letters','words','sentences','memory','numbers'].forEach(c=>{ state.completed[c] = state.completed[c] || {}; });
  checkStreak();
}
async function saveProgress(){
  if(!currentProfileId) return;
  try{ await window.storage.set('profile:'+currentProfileId, JSON.stringify(state), false); }catch(e){ /* best-effort */ }
}
function checkStreak(){
  const today = new Date().toDateString();
  if(state.lastPlayDate === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  if(state.lastPlayDate === y.toDateString()){ state.streak = (state.streak||0)+1; }
  else if(state.lastPlayDate){ state.streak = 1; }
  else { state.streak = 1; }
  state.lastPlayDate = today;
  if(state.streak>=3 && !state.badges.includes('streak')) state.badges.push('streak');
}

async function boot(){
  await loadProfilesIndex();
  if(profilesList.length===0){
    currentProfileId = null;
    state = freshState();
    view = 'onboard';
  } else if(profilesList.length===1){
    currentProfileId = profilesList[0].id;
    await loadProfileState(currentProfileId);
    view = state.onboarded ? 'map' : 'onboard';
  } else {
    view = 'profile-picker';
  }
  render();
}

/* ---------------- Helpers ---------------- */
function t(){ return STR[state.lang]; }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Makes a clickable <div> keyboard-accessible (Tab to focus, Enter/Space to activate) without changing its look.
function makeClickable(node, handler){
  node.setAttribute('tabindex','0');
  node.setAttribute('role','button');
  node.onclick = handler;
  node.onkeydown = (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); handler(e); } };
}
// The authentic handwriting-model font for whatever text/language is being shown —
// used everywhere a letter/word/sentence appears as HTML text, not just on the canvas.
function handwritingFontCss(text){
  return glyphFontFor(text).fontFamily;
}
function starsForChapter(ch){
  return Object.values(state.completed[ch]||{}).reduce((a,b)=>a+b,0);
}
function totalStarsInChapters(...chs){ return chs.reduce((a,c)=>a+starsForChapter(c),0); }
function isUnlocked(ch){
  if(ch==='warmup'||ch==='letters'||ch==='numbers') return true;
  if(ch==='words') return state.stars>=UNLOCK_THRESHOLD.words;
  if(ch==='memory') return state.stars>=UNLOCK_THRESHOLD.words;
  if(ch==='sentences') return state.stars>=UNLOCK_THRESHOLD.sentences;
  return false;
}
function maybeAwardBadges(){
  const b = state.badges;
  if(starsForChapter('warmup')>=14 && !b.includes('warmup')) b.push('warmup');
  if(starsForChapter('letters')>=45 && !b.includes('letters')) b.push('letters');
  if(starsForChapter('words')>=30 && !b.includes('words')) b.push('words');
  if(starsForChapter('sentences')>=20 && !b.includes('sentences')) b.push('sentences');
  if(starsForChapter('memory')>=18 && !b.includes('memory')) b.push('memory');
  if(starsForChapter('numbers')>=24 && !b.includes('numbers')) b.push('numbers');
  const usedLangs = new Set();
  ['warmup','letters','words','sentences'].forEach(ch=>{
    Object.keys(state.completed[ch]||{}).forEach(k=>{ if(k.startsWith(state.lang+':')) usedLangs.add(state.lang); });
  });
  // trilingual badge tracked via a stored set
  state.langsPlayed = state.langsPlayed || [];
  if(!state.langsPlayed.includes(state.lang)) state.langsPlayed.push(state.lang);
  if(state.langsPlayed.length>=3 && !b.includes('tri')) b.push('tri');
}
const BADGE_LABELS = { warmup:"badgeWarmup", letters:"badgeLetters", words:"badgeWords", sentences:"badgeSentences", tri:"badgeTri", streak:"badgeStreak", memory:"badgeMemory", numbers:"badgeNumbers" };
const BADGE_ICON = { warmup:"🌊", letters:"🔤", words:"📖", sentences:"🏔️", tri:"🌍", streak:"🔥", memory:"🧠", numbers:"🔢" };

/* ---------------- Rendering: root ---------------- */
function render(){
  document.body.dir = t().dir;
  document.documentElement.lang = state.lang;
  const app = document.getElementById('app');
  app.innerHTML = "";
  app.appendChild(renderTopbar());
  const stage = el(`<div class="stage" id="stage"></div>`);
  app.appendChild(stage);

  try{
    if(view==='loading'){ /* brief boot flash, nothing to render yet */ }
    else if(view==='profile-picker') renderProfilePicker(stage);
    else if(view==='onboard') renderOnboard(stage);
    else if(view==='map') renderMap(stage);
    else if(view==='levels') renderLevels(stage);
    else if(view==='freepractice') renderFreePractice(stage);
    else if(view==='memory-peek') renderMemoryPeek(stage);
    else if(view==='trace') renderTrace(stage);
    else if(view==='warmup') renderWarmupPicker(stage);

function renderMemoryWrite(stage){
  stage.innerHTML = "";
  const backBtn = el(`<button class="btn btn-ghost" style="margin-bottom:12px;">← ${t().back}</button>`);
  backBtn.onclick = ()=>{ view='levels'; render(); };
  stage.appendChild(backBtn);
  stage.appendChild(el(`<h2>🧠 ${t().memoryWritePrompt}</h2>`));

  const viewportW = Math.min(760, window.innerWidth - 70);
  const layout = layoutText(currentTarget || '', viewportW*0.92);
  const width = viewportW;
  const height = Math.max(170, Math.round(layout.lines.length*layout.lineHeight + 24));
  const canvasWrap = el(`<div class="canvas-wrap"></div>`);
  canvasWrap.style.height = height+'px';
  canvasWrap.style.width = width+'px';
  canvasWrap.style.margin = '8px auto 0';
  const drawCanvas = document.createElement('canvas');
  drawCanvas.width=width; drawCanvas.height=height; drawCanvas.className='canvas-layer';
  drawCanvas.style.position='relative';
  drawCanvas.style.width = width+'px'; drawCanvas.style.height = height+'px';
  canvasWrap.appendChild(drawCanvas);
  stage.appendChild(canvasWrap);

  // hidden reference masks used only for scoring — never shown to the learner
  const rawGuide = document.createElement('canvas'); rawGuide.width=width; rawGuide.height=height;
  drawGlyph(rawGuide.getContext('2d'), currentTarget, width, height, false);
  const dilatedGuide = document.createElement('canvas'); dilatedGuide.width=width; dilatedGuide.height=height;
  const dgctx = dilatedGuide.getContext('2d');
  try{ dgctx.filter = 'blur('+toleranceForTier()+'px)'; }catch(e){}
  drawGlyph(dgctx, currentTarget, width, height, false);

  const dctx2 = drawCanvas.getContext('2d');
  dctx2.lineJoin='round'; dctx2.lineCap='round'; dctx2.strokeStyle = '#00967F';
  let drawing=false, lastPt=null, pathLength=0;
  function pos(e){
    const r = drawCanvas.getBoundingClientRect();
    const cx = (e.touches? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches? e.touches[0].clientY : e.clientY) - r.top;
    return { x: cx*(width/r.width), y: cy*(height/r.height) };
  }
  function start(e){ e.preventDefault(); drawing=true; lastPt=pos(e); }
  function move(e){
    if(!drawing) return; e.preventDefault();
    const p = pos(e);
    dctx2.lineWidth = state.penWidth;
    dctx2.beginPath(); dctx2.moveTo(lastPt.x,lastPt.y); dctx2.lineTo(p.x,p.y); dctx2.stroke();
    pathLength += Math.hypot(p.x-lastPt.x, p.y-lastPt.y);
    lastPt = p;
  }
  function end(){ drawing=false; }
  ['mousedown','touchstart'].forEach(ev=>drawCanvas.addEventListener(ev,start,{passive:false}));
  ['mousemove','touchmove'].forEach(ev=>drawCanvas.addEventListener(ev,move,{passive:false}));
  ['mouseup','mouseleave','touchend'].forEach(ev=>drawCanvas.addEventListener(ev,end));

  const tools = el(`<div class="tools"></div>`);
  const penTool = el(`<div class="tool"><label>${t().penSize}</label><input type="range" min="6" max="26" step="2" value="${state.penWidth}"></div>`);
  penTool.querySelector('input').oninput = (e)=>{ state.penWidth = parseInt(e.target.value); };
  tools.appendChild(penTool);
  stage.appendChild(tools);

  const btnRow = el(`<div class="btn-row"></div>`);
  const clearBtn = el(`<button class="btn btn-secondary">${t().clearBtn}</button>`);
  clearBtn.onclick = ()=>{ dctx2.clearRect(0,0,width,height); pathLength=0; };
  const checkBtn = el(`<button class="btn btn-primary">${t().checkBtn}</button>`);
  const feedback = el(`<div class="feedback-banner"></div>`);
  checkBtn.onclick = ()=>{
    try{
      const scoreResult = scoreDrawing(drawCanvas, rawGuide, dilatedGuide, width, height);
      scoreResult.pathRatio = pathLength / expectedPathLength(scoreResult.guidePixelCount, state.penWidth);
      const stars = starsFromScore(scoreResult);
      const targetKey = state.lang+':'+currentTarget;
      const prev = (state.completed.memory||{})[targetKey] || 0;
      if(stars > prev){
        state.stars += (stars - prev);
        state.completed.memory = state.completed.memory || {};
        state.completed.memory[targetKey] = stars;
        maybeAwardBadges();
        saveProgress();
      }
      feedback.className = 'feedback-banner show ' + (stars>=3?'fb-great':stars>=1?'fb-ok':'fb-retry');
      const msg = stars>=3 ? t().fbGreat : stars>=1 ? t().fbOk : t().fbRetry;
      feedback.innerHTML = `<div><div class="stars-earned">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
        <div>${msg}</div>
        <div dir="${t().dir}" style="margin-top:6px;font-weight:800;">${t().memoryReveal} <span style="color:var(--grape);">${escapeHtml(currentTarget)}</span></div></div>`;
      render_topbarStarsOnly();
    }catch(err){
      console.error('Handwriting Quest memory scoring error:', err);
      feedback.className = 'feedback-banner show fb-retry';
      feedback.textContent = state.lang==='ar' ? "تعذّر تقييم الكتابة، حاول مرة أخرى." : state.lang==='fr' ? "Impossible d'évaluer l'écriture, réessaie." : "Couldn't score that attempt — please try again.";
    }
  };
  btnRow.appendChild(clearBtn); btnRow.appendChild(checkBtn);
  stage.appendChild(btnRow);
  stage.appendChild(feedback);
}

/* ---------------- Tracing engine (shared by letters/words/sentences/warmup) ---------------- */
function renderTrace(stage){ renderTraceStage(stage, currentChapter==='warmup'); }

function renderTraceStage(stage, isWarmup){
  const backBtn = el(`<button class="btn btn-ghost" style="margin-bottom:12px;">← ${t().back}</button>`);
  backBtn.onclick = ()=>{ view = isWarmup ? 'warmup' : (currentChapter==='free' ? 'freepractice' : 'levels'); render(); };
  stage.appendChild(backBtn);

  const label = isWarmup
    ? ({wave:t().patternWave,zig:t().patternZig,loop:t().patternLoop,diag:t().patternDiag,circle:t().patternCircle,bridge:t().patternBridge})[currentPatternKey]
    : escapeHtml(currentTarget || "");
  const labelFont = (isWarmup || currentChapter==='numbers') ? 'inherit' : handwritingFontCss(currentTarget);
  stage.appendChild(el(`<h2 dir="${isWarmup?'ltr':t().dir}" style="font-family:${labelFont};">${label}</h2>`));
  if(!isWarmup) stage.appendChild(el(`<p class="lead">${t().pickLevel==='' ? '' : ''}</p>`));

  const canvasWrap = el(`<div class="canvas-wrap"></div>`);
  let width, height;
  if(isWarmup){
    width = Math.min(820, window.innerWidth - 70);
    height = 220;
  } else {
    const viewportW = Math.min(760, window.innerWidth - 70);
    const layout = layoutText(currentTarget || '', viewportW*0.92);
    width = viewportW;
    height = Math.max(170, Math.round(layout.lines.length*layout.lineHeight + 24));
  }
  const guideCanvas = document.createElement('canvas');
  guideCanvas.width = width; guideCanvas.height = height; guideCanvas.className='canvas-layer';
  guideCanvas.style.position='relative'; guideCanvas.style.zIndex=1;
  guideCanvas.style.width = width+'px'; guideCanvas.style.height = height+'px';
  const drawCanvas = document.createElement('canvas');
  drawCanvas.width = width; drawCanvas.height = height; drawCanvas.className='canvas-layer';
  drawCanvas.style.position='absolute'; drawCanvas.style.top=0; drawCanvas.style.left=0; drawCanvas.style.zIndex=2;
  drawCanvas.style.width = width+'px'; drawCanvas.style.height = height+'px';
  canvasWrap.style.height = height+'px';
  canvasWrap.style.width = width+'px';
  canvasWrap.style.margin = '8px auto 0';
  canvasWrap.appendChild(guideCanvas);
  canvasWrap.appendChild(drawCanvas);
  stage.appendChild(canvasWrap);

  // build guide
  const precisionOn = isWarmup && warmupPrecision;
  const roadWidth = precisionOn ? 16 : 30;
  const gctx = guideCanvas.getContext('2d');
  gctx.clearRect(0,0,width,height);
  gctx.globalAlpha = state.guideOpacity;
  if(isWarmup){ drawPattern(gctx, currentPatternKey, width, height, false, roadWidth); }
  else { drawGlyph(gctx, currentTarget, width, height, false); }
  gctx.globalAlpha = 1;

  // offscreen raw + dilated guide masks for scoring
  const rawGuide = document.createElement('canvas'); rawGuide.width=width; rawGuide.height=height;
  const rctx = rawGuide.getContext('2d');
  if(isWarmup) drawPattern(rctx, currentPatternKey, width, height, false, roadWidth);
  else drawGlyph(rctx, currentTarget, width, height, false);

  const tolerance = Math.max(state.penWidth*0.5, precisionOn ? toleranceForTier()*0.55 : toleranceForTier());
  const dilatedGuide = document.createElement('canvas'); dilatedGuide.width=width; dilatedGuide.height=height;
  const dctx = dilatedGuide.getContext('2d');
  try{ dctx.filter = 'blur('+tolerance+'px)'; }catch(e){}
  if(isWarmup) drawPattern(dctx, currentPatternKey, width, height, false, roadWidth);
  else drawGlyph(dctx, currentTarget, width, height, false);

  // drawing interactions
  const dctx2 = drawCanvas.getContext('2d');
  dctx2.lineJoin='round'; dctx2.lineCap='round';
  dctx2.strokeStyle = '#00967F';
  let drawing=false, lastPt=null, pathLength=0;
  function pos(e){
    const r = drawCanvas.getBoundingClientRect();
    const cx = (e.touches? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches? e.touches[0].clientY : e.clientY) - r.top;
    return { x: cx*(width/r.width), y: cy*(height/r.height) };
  }
  function start(e){ e.preventDefault(); drawing=true; lastPt=pos(e); }
  function move(e){
    if(!drawing) return; e.preventDefault();
    const p = pos(e);
    dctx2.lineWidth = state.penWidth;
    dctx2.beginPath(); dctx2.moveTo(lastPt.x,lastPt.y); dctx2.lineTo(p.x,p.y); dctx2.stroke();
    pathLength += Math.hypot(p.x-lastPt.x, p.y-lastPt.y);
    lastPt = p;
  }
  function end(e){ drawing=false; }
  ['mousedown','touchstart'].forEach(ev=>drawCanvas.addEventListener(ev,start,{passive:false}));
  ['mousemove','touchmove'].forEach(ev=>drawCanvas.addEventListener(ev,move,{passive:false}));
  ['mouseup','mouseleave','touchend'].forEach(ev=>drawCanvas.addEventListener(ev,end));

  // tools
  const tools = el(`<div class="tools"></div>`);
  const guideTool = el(`<div class="tool"><label>${t().showGuide}</label><input type="range" min="0.05" max="0.6" step="0.05" value="${state.guideOpacity}"></div>`);
  guideTool.querySelector('input').oninput = (e)=>{ state.guideOpacity = parseFloat(e.target.value); gctx.clearRect(0,0,width,height); gctx.globalAlpha=state.guideOpacity; if(isWarmup) drawPattern(gctx,currentPatternKey,width,height,false); else drawGlyph(gctx,currentTarget,width,height,false); gctx.globalAlpha=1; };
  const penTool = el(`<div class="tool"><label>${t().penSize}</label><input type="range" min="6" max="26" step="2" value="${state.penWidth}"></div>`);
  penTool.querySelector('input').oninput = (e)=>{ state.penWidth = parseInt(e.target.value); };
  tools.appendChild(guideTool); tools.appendChild(penTool);
  stage.appendChild(tools);

  const btnRow = el(`<div class="btn-row"></div>`);
  const clearBtn = el(`<button class="btn btn-secondary">${t().clearBtn}</button>`);
  clearBtn.onclick = ()=>{ dctx2.clearRect(0,0,width,height); pathLength=0; };
  const checkBtn = el(`<button class="btn btn-primary">${t().checkBtn}</button>`);
  const feedback = el(`<div class="feedback-banner"></div>`);
  checkBtn.onclick = ()=>{
    try{
    const scoreResult = scoreDrawing(drawCanvas, rawGuide, dilatedGuide, width, height, tolerance);
    scoreResult.pathRatio = pathLength / expectedPathLength(scoreResult.guidePixelCount, state.penWidth);
    let stars = starsFromScore(scoreResult);

    const chapterKey = isWarmup ? 'warmup' : currentChapter;
    const targetKey = isWarmup ? state.lang+':'+currentPatternKey+(precisionOn?':precision':'') : state.lang+':'+currentTarget;
    const prev = (state.completed[chapterKey]||{})[targetKey] || 0;
    if(stars > prev){
      state.stars += (stars - prev);
      state.completed[chapterKey] = state.completed[chapterKey] || {};
      state.completed[chapterKey][targetKey] = stars;
      maybeAwardBadges();
      saveProgress();
    }

    feedback.className = 'feedback-banner show ' + (stars>=3?'fb-great':stars>=1?'fb-ok':'fb-retry');
    const msg = stars>=3 ? t().fbGreat : stars>=1 ? t().fbOk : t().fbRetry;
    const enc = t().encouragements[Math.floor(Math.random()*t().encouragements.length)];
    feedback.innerHTML = `<div><div class="stars-earned">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <div>${msg}</div><div style="opacity:.7;font-weight:600;font-size:.85rem;margin-top:2px;">${enc}</div></div>`;
    render_topbarStarsOnly();
    }catch(err){
      console.error('Handwriting Quest scoring error:', err);
      feedback.className = 'feedback-banner show fb-retry';
      feedback.textContent = state.lang==='ar' ? "تعذّر تقييم الكتابة، حاول مرة أخرى." : state.lang==='fr' ? "Impossible d'évaluer l'écriture, réessaie." : "Couldn't score that attempt — please try again.";
    }
  };
  btnRow.appendChild(clearBtn); btnRow.appendChild(checkBtn);
  stage.appendChild(btnRow);
  stage.appendChild(feedback);
}
function render_topbarStarsOnly(){
  const pill = document.querySelector('.stars-pill');
  if(pill) pill.textContent = `⭐ ${state.stars} ${t().starsLabel}`;
}

      groupResults.push({id:member.id, name:member.name, avatar:member.avatar, stars});
      feedback.className = 'feedback-banner show ' + (stars>=3?'fb-great':stars>=1?'fb-ok':'fb-retry');
      const msg = stars>=3?t().fbGreat:stars>=1?t().fbOk:t().fbRetry;
      const isLast = groupTurnIndex >= groupMembers.length-1;
      feedback.innerHTML = `<div><div class="stars-earned">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><div>${msg}</div></div>`;
      checkBtn.style.display='none'; clearBtn.style.display='none';
      const nextBtn = el(`<button class="btn btn-primary" style="margin-top:10px;">${isLast? '🏁 '+t().groupSeeResultsBtn : '➡️ '+t().groupNextBtn}</button>`);
      nextBtn.onclick = async ()=>{
        groupTurnIndex++;
        if(groupTurnIndex < groupMembers.length){ groupPhase='pass'; render(); }
        else{
          if(groupHostProfileId){ currentProfileId=groupHostProfileId; await loadProfileState(groupHostProfileId); }
          view='group-results'; render();
        }
      };
      feedback.appendChild(nextBtn);
    }catch(err){
      console.error('Group Mode scoring error:', err);
      feedback.className='feedback-banner show fb-retry';
      feedback.textContent = state.lang==='ar' ? "تعذّر تقييم الكتابة، حاول مرة أخرى." : state.lang==='fr' ? "Impossible d'évaluer l'écriture, réessaie." : "Couldn't score that attempt — please try again.";
    }
  };
  btnRow.appendChild(clearBtn); btnRow.appendChild(checkBtn);
  stage.appendChild(btnRow);
  stage.appendChild(feedback);
}

/* ---------------- Drawing guide targets ---------------- */
// Picks the correct handwriting-model font for a given piece of text.
function glyphFontFor(text){
  const isArabicText = /[\u0600-\u06FF]/.test(text||'');
  if(isArabicText) return { fontFamily:"'Noto Naskh Arabic','Arial',sans-serif", fontWeight:700, isArabicText };
  if(state.lang==='fr') return { fontFamily:"'Playwrite FR Trad','Baloo 2',cursive", fontWeight:400, isArabicText };
  return { fontFamily:"'Playwrite US Modern','Baloo 2',cursive", fontWeight:400, isArabicText };
}

// Works out font size + line-wrapping for a piece of text within maxWidth. Multi-word text
// (sentences) wraps across lines at a comfortably large, fluent size instead of being
// squeezed onto one line — this is shared by both the sizing step (renderTraceStage, so the
// canvas is built tall enough) and the actual drawing step (drawGlyph), so they always agree.
//
// Vertical space is based on the browser's ACTUAL measured ascent/descent for this exact
// text (via TextMetrics.actualBoundingBox*), not a guessed multiplier — a guessed multiplier
// is what caused French cursive letters with both a tall ascender and a deep descender (like
// "f", which in French cursive rises above AND drops below the line) to get clipped: no fixed
// multiplier is safe for every glyph in every font.
function layoutText(text, maxWidth){
  text = text || '';
  const {fontFamily, fontWeight, isArabicText} = glyphFontFor(text);
  const words = text.split(/\s+/).filter(Boolean);
  const singleWord = words.length<=1;
  const len = text.length;
  let size = singleWord ? (len<=2?150 : len<=5?100 : 70) : 50;

  const scratch = document.createElement('canvas').getContext('2d');
  scratch.direction = isArabicText ? 'rtl' : 'ltr';
  function metricsAt(s, sz){ scratch.font = `${fontWeight} ${sz}px ${fontFamily}`; return scratch.measureText(s); }
  function widthAt(s, sz){ return metricsAt(s, sz).width; }

  function pack(sz){
    if(singleWord) return [text];
    const lines = []; let cur = '';
    words.forEach(word=>{
      const test = cur ? cur+' '+word : word;
      if(!cur || widthAt(test, sz) <= maxWidth){ cur = test; }
      else { lines.push(cur); cur = word; }
    });
    if(cur) lines.push(cur);
    return lines;
  }

  let lines = pack(size);
  // Safety: shrink only if a line still doesn't fit even after wrapping (e.g. one very long word).
  while(size>16 && lines.some(l=> widthAt(l,size) > maxWidth)){ size -= 2; lines = pack(size); }

  // Measure the REAL vertical extent of this exact text at this exact size. Fall back to a
  // generous estimate only if the browser doesn't support actualBoundingBox metrics.
  let maxAsc = 0, maxDesc = 0, gotRealMetrics = false;
  lines.forEach(line=>{
    const m = metricsAt(line, size);
    if(typeof m.actualBoundingBoxAscent === 'number' && typeof m.actualBoundingBoxDescent === 'number'
       && (m.actualBoundingBoxAscent>0 || m.actualBoundingBoxDescent>0)){
      gotRealMetrics = true;
      maxAsc = Math.max(maxAsc, m.actualBoundingBoxAscent);
      maxDesc = Math.max(maxDesc, m.actualBoundingBoxDescent);
    }
  });
  if(!gotRealMetrics){ maxAsc = size*0.9; maxDesc = size*0.5; } // safe fallback for older browsers

  const breathingRoom = size*0.22;
  const lineHeight = maxAsc + maxDesc + breathingRoom;
  return { fontFamily, fontWeight, isArabicText, size, lines, lineHeight, maxAsc, maxDesc };
}

function drawGlyph(ctx, text, w, h, forMask){
  ctx.clearRect(0,0,w,h);
  if(!text){ text = "?"; }
  ctx.fillStyle = forMask ? '#000' : '#2A2118';
  const layout = layoutText(text, w*0.92);
  ctx.font = `${layout.fontWeight} ${layout.size}px ${layout.fontFamily}`;
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.direction = layout.isArabicText ? 'rtl' : 'ltr';
  const totalHeight = layout.lines.length * layout.lineHeight;
  const top = h/2 - totalHeight/2;
  layout.lines.forEach((line,i)=>{
    const baselineY = top + i*layout.lineHeight + layout.maxAsc + (layout.lineHeight - layout.maxAsc - layout.maxDesc)/2;
    ctx.fillText(line, w/2, baselineY);
  });
}
function drawPattern(ctx, key, w, h, forMask, roadWidth){
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle = forMask ? '#000' : '#2A2118';
  ctx.lineWidth = roadWidth || 30; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  const margin=40;
  if(key==='wave'){
    ctx.moveTo(margin,h/2);
    for(let x=margin;x<=w-margin;x+=4){ const y = h/2 + Math.sin((x-margin)/40)*h*0.28; ctx.lineTo(x,y); }
  } else if(key==='zig'){
    const n=6; ctx.moveTo(margin,h*0.2);
    for(let i=1;i<=n;i++){ const x = margin + (w-2*margin)*(i/n); const y = i%2? h*0.8 : h*0.2; ctx.lineTo(x,y); }
  } else if(key==='loop'){
    const loops=4; ctx.moveTo(margin,h/2);
    for(let i=0;i<=loops;i++){
      const cx = margin + (w-2*margin)*(i/loops);
      ctx.arc(cx, h/2, (h*0.32), Math.PI*0.5, Math.PI*2.5, false);
    }
  } else if(key==='diag'){
    ctx.moveTo(margin,h-margin);
    for(let i=0;i<5;i++){
      const x0 = margin + i*((w-2*margin)/5);
      ctx.lineTo(x0+((w-2*margin)/10), margin);
      ctx.lineTo(x0+((w-2*margin)/5), h-margin);
    }
  } else if(key==='circle'){
    const n=3; const r = Math.min(h*0.36, (w-2*margin)/(2*n)*0.9);
    for(let i=0;i<n;i++){
      const cx = margin + r + i*((w-2*margin-2*r)/(n-1||1));
      ctx.moveTo(cx+r, h/2);
      ctx.arc(cx, h/2, r, 0, Math.PI*2, false);
    }
  } else if(key==='bridge'){
    const n=4; ctx.moveTo(margin, h*0.75);
    for(let i=0;i<n;i++){
      const x0 = margin + i*((w-2*margin)/n);
      const x1 = x0 + ((w-2*margin)/n)/2;
      const x2 = x0 + ((w-2*margin)/n);
      ctx.quadraticCurveTo(x1, h*0.2, x2, h*0.75);
    }
  }
  ctx.stroke();
}

/* ---------------- Scoring ---------------- */
// Younger learners get a bit more tolerance for wobble; older learners are held to a tighter line.
// Tolerance must cover however wide the learner's pen stroke naturally is (it extends
// penWidth/2 on each side of a centered line), plus a per-tier slack for hand wobble.
// Cursive/script fonts have much thinner glyph strokes than the pen, so without this the
// scorer was flagging normal pen overhang as "overflow" and scores felt inconsistent.
function toleranceForTier(){
  const slack = ({A:9, B:6, C:4})[state.tier] || 7;
  return slack + (state.penWidth||14) * 0.5;
}

function scoreDrawing(userCanvas, rawGuideCanvas, dilatedGuideCanvas, w, h, toleranceOverride){
  const ux = userCanvas.getContext('2d').getImageData(0,0,w,h).data;
  const gx = rawGuideCanvas.getContext('2d').getImageData(0,0,w,h).data;
  const dgx = dilatedGuideCanvas.getContext('2d').getImageData(0,0,w,h).data;
  // dilated user (blur user strokes) for coverage check — same tolerance radius as the guide dilation
  const tolerance = toleranceOverride || toleranceForTier();
  const tmp = document.createElement('canvas'); tmp.width=w; tmp.height=h;
  const tctx = tmp.getContext('2d');
  try{ tctx.filter='blur('+tolerance+'px)'; }catch(e){}
  tctx.drawImage(userCanvas,0,0);
  const dux = tctx.getImageData(0,0,w,h).data;

  const STEP = 3; // sample every 3px for perf
  let guideTotal=0, guideCovered=0, userTotal=0, userNear=0;
  for(let y=0;y<h;y+=STEP){
    for(let x=0;x<w;x+=STEP){
      const idx = (y*w+x)*4;
      const gA = gx[idx+3];
      const uA = ux[idx+3];
      if(gA>40){
        guideTotal++;
        if(dux[idx+3]>30) guideCovered++;
      }
      if(uA>40){
        userTotal++;
        if(dgx[idx+3]>20) userNear++;
      }
    }
  }
  const coverage = guideTotal? guideCovered/guideTotal : 0;
  const overflow = userTotal? 1-(userNear/userTotal) : 1;
  // Penalize attempts that are much thinner/sparser than the target shape needs —
  // catches "scribbled a little bit in the right area" instead of actually writing it.
  const completeness = guideTotal? Math.min(1, userTotal/(guideTotal*0.35)) : 0;
  return { coverage, overflow, userPixelCount:userTotal, guidePixelCount:guideTotal, completeness };
}

// How much ink a single clean pass over the guide would need, given the current pen width —
// used to tell a genuine trace apart from a scribble that backtracks over the same area.
function expectedPathLength(guidePixelCount, penWidth){
  const pw = Math.max(4, penWidth||14);
  return Math.max(30, guidePixelCount / pw);
}

function starsFromScore({coverage, overflow, userPixelCount, completeness, pathRatio}){
  if(userPixelCount < 25) return 0;
  if(completeness < 0.4) return coverage>0.5 ? 1 : 0; // traced only a fragment of the target
  let stars = 0;
  if(coverage>0.86 && overflow<0.16 && completeness>0.75) stars = 3;
  else if(coverage>0.64 && overflow<0.32 && completeness>0.55) stars = 2;
  else if(coverage>0.38 && overflow<0.58) stars = 1;
  // Coverage/overflow alone can be fooled by a dense scribble that happens to fill the
  // letter's bounding area — it can look "close enough" without ever actually following the
  // shape. pathRatio compares how much ink the learner actually laid down against how much a
  // single clean pass over the guide would need; heavy backtracking/scribbling always uses far
  // more ink than a real trace, so it caps the star rating even if coverage looked good.
  if(typeof pathRatio === 'number' && isFinite(pathRatio)){
    if(pathRatio > 2.6) stars = Math.min(stars, 1);
    else if(pathRatio > 1.85) stars = Math.min(stars, 2);
  }
  return stars;
}
